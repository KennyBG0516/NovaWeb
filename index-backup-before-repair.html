<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaWeb | Agencia de Desarrollo Web</title>
    <meta name="description" content="NovaWeb: agencia de desarrollo web especializada en crear sitios web modernos y optimizados para convertir visitantes en clientes">
    <style>
        :root {
            --bg: #f8fafc;
            --bg-subtle: #f1f5f9;
            --card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-on-card: #0f172a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --muted-border: #cbd5e1;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Tipografía */
        h1 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; line-height: 1.1; }
        h2 { font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 700; line-height: 1.2; }
        h3 { font-size: clamp(1.25rem, 3vw, 1.5rem); font-weight: 600; }
        p { font-size: clamp(1rem, 2vw, 1.125rem); }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 100;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        header.scrolled {
            background: rgba(248, 250, 252, 0.95);
            box-shadow: var(--shadow-md);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-on-card);
            text-decoration: none;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo svg {
            width: 28px;
            height: 28px;
        }

        nav ul {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.875rem;
            position: relative;
            padding-bottom: 4px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--accent);
        }

        nav a.active {
            color: var(--text-primary);
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
        }

        nav a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* Menú móvil */
        .mobile-nav-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
        }

        .mobile-nav-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--text-primary);
        }

        @media (max-width: 768px) {
            .mobile-nav-btn {
                display: block;
            }

            nav ul {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                left: 100%;
                flex-direction: column;
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(20px);
                width: 60%;
                max-width: 300px;
                padding-top: 4rem;
                transition: left 0.3s ease;
            }

            nav ul.active {
                left: 0;
            }

            nav ul li {
                margin: 1rem 0;
            }

            nav a {
                font-size: 1rem;
                width: 100%;
                text-align: center;
            }
        }

        /* Hero */
        #inicio {
            padding-top: calc(8rem + 64px);
            padding-bottom: 6rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
                gap: 2rem;
                text-align: center;
            }

            .hero h1 {
                font-size: clamp(2rem, 5vw, 3rem);
            }

            .hero p {
                font-size: 1rem;
            }
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: var(--text-on-card);
        }

        .hero p {
            font-size: clamp(1.125rem, 2vw, 1.25rem);
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .eyebrow {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
        }

        .hero .btn-primario {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 1rem 2rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.875rem;
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .hero .btn-primario:hover {
            background: var(--accent-hover);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(59, 102, 241, 0.35);
        }

        .hero .btn-primario:focus-visible {
            outline: 2px solid white;
            outline-offset: 2px;
        }

        /* Services */
        #servicios {
            padding: 8rem 2rem 6rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .seccion-titulo {
            text-align: center;
            margin-bottom: 3rem;
        }

        .seccion-titulo .section-eyebrow {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            border-radius: 4px;
        }

        .seccion-titulo h2 {
            color: var(--text-on-card);
            font-size: clamp(2rem, 4vw, 2.75rem);
            line-height: 1.2;
        }

        .seccion-titulo p {
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
            font-size: clamp(1rem, 2vw, 1.125rem);
        }

        .servicios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .servicio-card {
            background: var(--card);
            border: 1px solid var(--muted-border);
            border-radius: 16px;
            padding: 2.5rem 2rem 2rem;
            transition: var(--transition-smooth);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .servicio-card .card-number {
            font-size: 3rem;
            font-weight: 800;
            color: var(--bg-subtle);
            line-height: 1;
            margin-bottom: 1.5rem;
            font-family: inherit;
        }

        .servicio-card .card-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 1.5rem;
        }

        .servicio-card .card-icon svg {
            width: 100%;
            height: 100%;
        }

        .servicio-card h3 {
            margin: 1rem 0 0.5rem;
            color: var(--text-on-card);
            font-size: 1.25rem;
        }

        .servicio-card p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .servicio-card .card-indicator {
            position: absolute;
            bottom: 1.5rem;
            opacity: 0;
            transform: scale(0.8) rotate(-45deg);
            transition: var(--transition-fast);
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 600;
        }

        .servicio-card:hover .card-indicator {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .servicio-card:hover {
            border-color: var(--accent);
            transform: translateY(-6px) scale(1.01);
            box-shadow: var(--shadow-lg);
        }

        .servicio-card:hover::before {
            opacity: 1;
        }

        /* Proceso */
        #proceso {
            padding: 8rem 2rem 6rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .proceso-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            position: relative;
            padding: 0 2rem;
        }

        .proceso-grid::before {
            content: '';
            position: absolute;
            top: 30px;
            left: 5%;
            right: 5%;
            height: 2px;
            background: var(--muted-border);
            transition: background 0.3s ease;
        }

        .proceso-grid:hover::before {
            background: var(--accent);
        }

        .proceso-etapa {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 1rem;
            position: relative;
            padding: 2rem 1rem;
            background: var(--card);
            border: 1px solid var(--muted-border);
            border-radius: 16px;
            transition: var(--transition-smooth);
            cursor: default;
        }

        .proceso-etapa:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .proceso-etapa:hover .proceso-numero {
            color: var(--accent);
            transform: scale(1.1);
        }

        .proceso-numero {
            font-size: 3rem;
            font-weight: 800;
            color: var(--bg-subtle);
            line-height: 1;
            transition: var(--transition-fast);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .proceso-etapa:hover .proceso-numero svg {
            stroke: var(--accent);
        }

        .proceso-icono {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            transition: var(--transition-fast);
        }

        .proceso-etapa:hover .proceso-icono {
            transform: scale(1.1);
        }

        .proceso-etapa h3 {
            margin: 0.5rem 0 0;
            color: var(--text-on-card);
            font-size: 1rem;
            transition: color var(--transition-fast);
        }

        .proceso-etapa:hover h3 {
            color: var(--accent);
        }

        .proceso-etapa p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.6;
            text-align: center;
        }

        .proceso-linea {
            width: 100%;
            height: 1px;
            background: var(--muted-border);
        }

        @media (prefers-reduced-motion: reduce) {
            .proceso-numero {
                transition: none;
            }
            .proceso-etapa:hover {
                transform: none;
            }
            .proceso-icono {
                transition: none;
            }
            .proceso-etapa:hover .proceso-icono {
                transform: none;
            }
        }

        @media (max-width: 968px) {
            .proceso-grid {
                grid-template-columns: 1fr;
            }

            .proceso-grid::before {
                position: static;
                margin: 2rem 0;
                height: 1px;
            }

            .proceso-etapa {
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nosotros-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
        }

        .nosotros-texto h2 {
            color: var(--text-on-card);
            margin-bottom: 1rem;
        }

        .nosotros-texto p {
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .nosotros-ico {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .nosotros-ico svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Contacto */
        #contacto {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .contacto-cta {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.875rem;
            text-decoration: none;
            transition: var(--transition-smooth);
            margin-top: 1rem;
        }

        .contacto-cta:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-md);
        }

        .contacto-cta:focus-visible {
            outline: 2px solid white;
            outline-offset: 2px;
        }

        .contacto-info {
            margin-top: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .contacto-detalle {
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
        }

        .contacto-detalle strong {
            color: var(--text-on-card);
        }

        /* Footer */
        footer {
            padding: 3rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--muted-border);
        }

        /* Animaciones de aparición */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: var(--transition-smooth);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Interacciones específicas */
        .nav a { transition: color 0.2s ease; }
        .hero .btn-primario { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .servicio-card { transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease; }

        /* Reduced motion overlay */
        @media (prefers-reduced-motion: reduce) {
            .reveal { transition: opacity 0.01ms ease; }
            .hero .btn-primario { transition: none; }
            .servicio-card { transition: none; }
            .proyecto-card { transition: transform 0.2s ease; }
        }

    <script>
        // Header scroll effect
        const header = document.querySelector('header');
        let lastScroll = 0;
        
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            
            if (currentScroll > lastScroll && currentScroll > 100) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
            
            lastScroll = currentScroll;
        });

        // Mobile nav toggle
        const mobileNavBtn = document.querySelector('.mobile-nav-btn');
        const navUl = document.querySelector('nav ul');
        
        if (mobileNavBtn) {
            mobileNavBtn.addEventListener('click', () => {
                navUl.classList.toggle('active');
            });
        }

        // Close mobile nav when clicking a link
        document.querySelectorAll('nav ul a').forEach(link => {
            link.addEventListener('click', () => {
                navUl.classList.remove('active');
            });
        });
    </script>
